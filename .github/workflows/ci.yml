name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  ts-ci:
    name: TypeScript & Node.js CI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Run Unit Tests
        run: pnpm test

      - name: Build Packages
        run: pnpm build

  rust-ci:
    name: Rust Helper Crate CI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Run Cargo Test
        run: cargo test --manifest-path crates/evergreen-ttl/Cargo.toml

      - name: Run Cargo Clippy
        run: cargo clippy --manifest-path crates/evergreen-ttl/Cargo.toml -- -D warnings
